server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/linkset+json text/markdown image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    include /etc/nginx/snippets/security-headers.conf;

    # Do not expose Cloudflare Pages _headers definition in Nginx runtime
    location = /_headers {
        return 404;
    }

    # OAuth callback is an SPA route, NOT an API route
    location = /oauth2/callback {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location /oauth2/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /sync/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /auth/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /me {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /me/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /mcp {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Discovery & Documentation Endpoints (strict MIME + CORS + Link parity)
    location = /auth.md {
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~ ^/(llms|llms-full)\.txt$ {
        default_type "text/plain; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location = /.well-known/api-catalog {
        default_type "application/linkset+json";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header ETag '"vnacc-api-catalog-v1"' always;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        default_type "text/plain; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~ ^/\.well-known/(mcp-server-card|oauth-authorization-server|oauth-protected-resource)$ {
        default_type "application/json; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~ ^/\.well-known/.*\.json$ {
        default_type "application/json; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /.well-known/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # Service worker must always revalidate
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        default_type "image/x-icon";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Cache static hashed assets without dropping security headers
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, no-transform, immutable" always;
    }

    # Root HTML entry: RFC 8288 discovery links & no-cache revalidation
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Link "</auth.md>; rel=\"authorizing-agent\"" always;
        add_header Link "</.well-known/api-catalog>; rel=\"https://www.iana.org/assignments/link-relations/api-catalog\"" always;
        add_header Link "</.well-known/agent-card.json>; rel=\"agent-card\"" always;
        add_header Link "</.well-known/mcp/server-card.json>; rel=\"mcp-server-card\"" always;
        add_header Link "</.well-known/agent-skills/index.json>; rel=\"agent-skills\"" always;
        add_header Link "</.well-known/oauth-authorization-server>; rel=\"https://www.iana.org/assignments/link-relations/oauth-authorization-server\"" always;
        add_header Link "</.well-known/oauth-protected-resource>; rel=\"https://www.iana.org/assignments/link-relations/oauth-protected-resource\"" always;
        add_header Link "</.well-known/ai-catalog.json>; rel=\"service-desc\"" always;
        add_header Link "</llms.txt>; rel=\"describedby\"" always;
        try_files /index.html =404;
    }

    # SPA routing: fallback to index.html for client navigation routes
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
