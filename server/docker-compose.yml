# E2E manual local testing (NOT run in CI).
# Usage:
#   1. cp .env.example .env  (fill in a REAL generated JWT_SIGNING_KEY, see .env.example)
#   2. docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
      POSTGRES_DB: vietnam_accounting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d vietnam_accounting"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is the service name.
      DATABASE_URL: postgres://accounting:accounting@postgres:5432/vietnam_accounting?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  pgdata:
