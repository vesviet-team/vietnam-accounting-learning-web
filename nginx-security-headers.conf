# Shared security headers included across server & location blocks so
# location-level add_header overrides never drop security defaults.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://hoa.tanhdev.com; img-src 'self' data: blob:; connect-src 'self' https://hoa.tanhdev.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
