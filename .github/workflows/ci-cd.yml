name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vesviet-team/vietnam-accounting-learning-web

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Lint & Code Quality
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Code Quality & Secret Scan
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: 'Secret Scanner: Detect Committed Secrets'
        run: |
          echo "=== Secret Scanner ==="
          echo "Rule: No API tokens, private keys, or credentials committed."
          
          # Check for committed .env file
          if git ls-files | grep -q "^\.env$"; then
            echo "❌ VIOLATION: .env file is tracked by git."
            exit 1
          fi

          # Scan for common secret patterns
          HARDCODED_SECRETS=$(git ls-files '*.ts' '*.tsx' '*.js' '*.json' \
            | xargs grep -rnE "ghp_[A-Za-z0-9_]{36}|github_pat_[A-Za-z0-9_]{82}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY" 2>/dev/null \
            || true)

          if [ -n "$HARDCODED_SECRETS" ]; then
            echo "❌ VIOLATION: Detected possible secrets in tracked files:"
            echo "$HARDCODED_SECRETS"
            exit 1
          fi

          echo "✅ Secret scan passed: No secrets detected in tracked files."

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Automated Testing
  # ──────────────────────────────────────────────────────────────
  test:
    name: Unit & Adversarial Tests
    runs-on: [self-hosted, linux, x64, docker]
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Adversarial Tests
        run: npm run test

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Container Image Build & Security Scan
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build and Push Container Image
    runs-on: [self-hosted, linux, x64, docker]
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/vesviet-team/vietnam-accounting-learning-web:${{ github.sha }}
            ghcr.io/vesviet-team/vietnam-accounting-learning-web:main
            ghcr.io/vesviet-team/vietnam-accounting-learning-web:latest

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/vesviet-team/vietnam-accounting-learning-web:main
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan Security Vulnerabilities
        uses: anchore/scan-action@v5
        with:
          sbom: sbom.spdx.json
          fail-build: false
          severity-cutoff: critical
          output-format: table

  # ──────────────────────────────────────────────────────────────
  # Stage 4: Kubernetes In-Cluster Rollout
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: In-Cluster Rollout to K3s Homelab
    runs-on: [self-hosted, linux, x64, docker]
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: In-Cluster Rollout Restart
        run: |
          echo "========================================================"
          echo "🚀 Rolling restart deployment/vietnam-accounting-web..."
          echo "========================================================"
          kubectl rollout restart deployment/vietnam-accounting-web -n vietnam-accounting

          echo "⏳ Waiting for rollout completion (timeout: 180s)..."
          kubectl rollout status deployment/vietnam-accounting-web -n vietnam-accounting --timeout=180s
          echo "✅ Rollout completed successfully."

      - name: Automatic Rollback on Failure
        if: failure()
        run: |
          echo "========================================================"
          echo "⚠️ Rollout failed or timed out! Executing rollback..."
          echo "========================================================"
          kubectl rollout undo deployment/vietnam-accounting-web -n vietnam-accounting || true
          kubectl rollout status deployment/vietnam-accounting-web -n vietnam-accounting --timeout=180s || true

      - name: Automated Health Probes
        run: |
          echo "========================================================"
          echo "🔍 Automated Health Probes"
          echo "========================================================"
          echo "Testing internal CoreDNS probe..."
          for i in {1..10}; do
            if curl --connect-timeout 3 -fsS http://vietnam-accounting-web.vietnam-accounting.svc.cluster.local:8810/healthz; then
              echo "✅ CoreDNS probe passed."
              break
            fi
            echo "CoreDNS probe retry $i/10..."
            sleep 2
          done

          echo "Testing LAN IP probes..."
          curl --connect-timeout 3 -fsS http://192.168.1.114:8810/healthz
          curl --connect-timeout 3 -fsS http://192.168.1.116:8810/healthz
          echo "🎉 All health probes passed!"
