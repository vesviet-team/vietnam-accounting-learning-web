name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vesviet-team/vietnam-accounting-learning-web

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Lint & Code Quality
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Code Quality & Secret Scan
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: 'Secret Scanner: Detect Committed Secrets'
        run: |
          echo "=== Secret Scanner ==="
          echo "Rule: No API tokens, private keys, or credentials committed."
          
          # Check for committed .env file
          if git ls-files | grep -q "^\.env$"; then
            echo "❌ VIOLATION: .env file is tracked by git."
            exit 1
          fi

          # Scan for common secret patterns
          HARDCODED_SECRETS=$(git ls-files '*.ts' '*.tsx' '*.js' '*.json' \
            | xargs grep -rnE "ghp_[A-Za-z0-9_]{36}|github_pat_[A-Za-z0-9_]{82}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY" 2>/dev/null \
            || true)

          if [ -n "$HARDCODED_SECRETS" ]; then
            echo "❌ VIOLATION: Detected possible secrets in tracked files:"
            echo "$HARDCODED_SECRETS"
            exit 1
          fi

          echo "✅ Secret scan passed: No secrets detected in tracked files."

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Automated Testing
  # ──────────────────────────────────────────────────────────────
  test:
    name: Unit & Adversarial Tests
    runs-on: [self-hosted, linux, x64, docker]
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Adversarial Tests
        run: npm run test

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Container Image Build & Security Scan
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build and Push Container Image
    runs-on: [self-hosted, linux, x64, docker]
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/vesviet-team/vietnam-accounting-learning-web:${{ steps.sha.outputs.short }}
            ghcr.io/vesviet-team/vietnam-accounting-learning-web:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/vesviet-team/vietnam-accounting-learning-web:main
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan Security Vulnerabilities
        uses: anchore/scan-action@v5
        with:
          sbom: sbom.spdx.json
          fail-build: false
          severity-cutoff: critical
          output-format: table

  # ──────────────────────────────────────────────────────────────
  # Stage 4: GitOps Write-Back Deploy (Zero kubectl)
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: GitOps Write-Back Deploy (ArgoCD Auto-Sync)
    runs-on: [self-hosted, linux, x64, docker]
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Install kustomize
        run: |
          if ! command -v kustomize &> /dev/null; then
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/kustomize
          fi
          kustomize version

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: vesviet-team/gitops
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops-repo

      - name: Bump image tag in GitOps
        run: |
          cd gitops-repo/apps/vietnam-accounting
          kustomize edit set image \
            ghcr.io/vesviet-team/vietnam-accounting-learning-web=ghcr.io/vesviet-team/vietnam-accounting-learning-web:${{ needs.build.outputs.image_tag }}
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add kustomization.yaml
          git commit -m "chore(deploy): bump vietnam-accounting to ${{ needs.build.outputs.image_tag }} [skip ci]"

      - name: Push with retry rebase
        run: |
          cd gitops-repo
          for i in 1 2 3 4 5; do
            echo "Push attempt $i/5..."
            git push origin main && echo "✅ Push succeeded." && break
            echo "⚠️ Conflict detected, rebasing..."
            git pull --rebase origin main
          done

      - name: Verify ArgoCD sync (wait for auto-sync)
        run: |
          echo "Waiting 30s for ArgoCD auto-sync..."
          sleep 30
          echo "Verifying health endpoint..."
          for i in {1..15}; do
            if curl --connect-timeout 3 -fsS http://vietnam-accounting-web.vietnam-accounting.svc.cluster.local:8810/healthz; then
              echo "✅ Health probe passed — deployment successful!"
              exit 0
            fi
            echo "Retry $i/15..."
            sleep 5
          done
          echo "⚠️ Health probe timed out — check ArgoCD for sync status."
          exit 1
